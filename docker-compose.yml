services:
  api:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      LOG_LEVEL: INFO
    volumes:
      - ./backend:/app
  web:
    image: node:22-alpine
    working_dir: /web
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
    volumes:
      - ./frontend:/web
    depends_on: [api]
